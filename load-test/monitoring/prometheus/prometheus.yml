global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'eatda-load-test'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'spring-boot-app'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['eatda-app:8080']
        labels:
          application: 'eatda-server'
          environment: 'load-test'
