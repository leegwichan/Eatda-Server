spring:
  config:
    import:
      - classpath:application-monitor.yml

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/eatda?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
    username: ${SPRING_DATASOURCE_USERNAME:eatda}
    password: ${SPRING_DATASOURCE_PASSWORD:eatda123}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  cloud:
    aws:
      region:
        static: ap-northeast-2
      s3:
        bucket: eatda-storage-local

  jpa:
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true
        use_sql_comments: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    root: INFO
    eatda: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

jwt:
  access-token-expiration: 1h
  refresh-token-expiration: 1d
  secret-key: ${JWT_SECRET_KEY}

cors:
  origin:
    - "http://localhost:3000"
    - "http://localhost:8080"

oauth:
  client-id: ${OAUTH_CLIENT_ID:unused-in-load-test}
  redirect-path: /login/callback
  allowed-origins:
    - "http://localhost:3000"

kakao:
  api-key: ${KAKAO_API_KEY:unused-in-load-test}

local-docker:
  enabled: ${LOCAL_DOCKER_ENABLED:true}

localstack:
  external-url: ${LOCALSTACK_EXTERNAL_URL:http://localhost:4566}
  internal-url: ${LOCALSTACK_INTERNAL_URL:http://localstack:4566}

springdoc:
  swagger-ui:
    path: /docs/swagger
    url: /docs/openapi3.yaml
    disable-swagger-default-url: true
    persist-authorization: true
    display-request-duration: true
    default-model-expand-depth: 10
